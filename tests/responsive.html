<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Atlas responsive QA</title><style>body{margin:0;background:#252a32;color:white;font:12px system-ui}nav{padding:12px;display:flex;gap:12px;align-items:center}iframe{display:block;border:0;width:390px;height:844px;background:#0b0d10}button{padding:8px 14px}</style></head><body><nav>Atlas QA <button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1440">1440px</button></nav><iframe title="Responsive Atlas preview" src="/style-gallery/explorer.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(button=>button.onclick=()=>{frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.width==='1440'?'900px':'844px';frame.contentWindow.location.reload();});</script></body></html>
