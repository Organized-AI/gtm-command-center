name = "gtmcc"
main = "docs/_worker.js"
compatibility_date = "2026-09-04"
keep_vars = true

[assets]
directory = "./worker-assets"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
AUTH_PROVIDER = "google"
APP_ORIGIN = "https://gtmcc.organizedai.vip"

[[kv_namespaces]]
binding = "GTM_SESSIONS"
id = "3ffa19fbff38489c9166a4c196e6e8cc"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
