<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTM Audit Pro — Style Gallery</title>
<style>
:root{color-scheme:dark;--bg:#0c0b09;--panel:#15130f;--panel2:#1c1913;--ink:#f7f2df;--muted:#a69f8b;--line:#353025;--gold:#ffe94a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(12,11,9,.96);display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{min-width:190px}.brand strong{font-size:14px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.styles{display:flex;gap:5px;flex-wrap:wrap}.styles button,.open{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:6px;padding:8px 11px;font:inherit;font-size:11px;cursor:pointer}.styles button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#111}.spacer{flex:1}.dimension{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px}.switch{position:relative;width:56px;height:28px}.switch input{position:absolute;opacity:0}.track{display:block;width:56px;height:28px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}.track:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:var(--ink);transition:transform .18s}.switch input:checked+.track{background:var(--gold);border-color:var(--gold)}.switch input:checked+.track:after{transform:translateX(28px);background:#111}.current{font-size:10px;color:var(--muted);min-width:155px;text-align:right}.open{text-decoration:none;color:var(--gold)}.frame{position:relative;min-height:0;background:#080705}.frame iframe{display:block;width:100%;height:100%;border:0;background:white}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s}.loading.show{opacity:1}@media(max-width:760px){.bar{gap:9px}.brand{width:100%}.spacer{display:none}.current{display:none}.styles{order:3;width:100%}.styles button{flex:1}.frame{min-height:0}}
</style></head><body><div class="app"><header class="bar"><div class="brand"><strong>GTM Audit Pro · Style Gallery</strong><span id="meta"></span></div><nav class="styles" aria-label="Visualization style"><button data-style="axonometric">Axonometric</button><button data-style="structured" aria-pressed="true">Structured</button><button data-style="spatial">Free-form</button><button data-style="utility">Utility</button></nav><span class="spacer"></span><div class="dimension"><span>2D</span><label class="switch"><input id="dimension" type="checkbox" checked aria-label="Toggle 3D"><span class="track"></span></label><span>3D</span></div><div class="current" id="current"></div><a class="open" id="open" target="_blank" rel="noopener">Open view</a></header><main class="frame"><iframe id="viewer" title="GTM visualization preview"></iframe><div class="loading" id="loading">Loading visualization…</div></main></div>
<script>
const CONFIG={"client": "Northstar Demo", "container": "Northstar Web", "labels": {"axonometric": "Axonometric Building", "structured": "Structured Container", "spatial": "Free-form Spatial", "utility": "Utility Style"}, "views": {"axonometric": {"2d": "axonometric-2d.html", "3d": "axonometric-3d.html"}, "structured": {"2d": "structured-2d.html", "3d": "structured-3d.html"}, "spatial": {"2d": "spatial-2d.html", "3d": "spatial-3d.html"}, "utility": {"2d": "utility-2d.html", "3d": "utility-3d.html"}}},viewer=document.getElementById('viewer'),toggle=document.getElementById('dimension'),current=document.getElementById('current'),openLink=document.getElementById('open'),loading=document.getElementById('loading');let style='structured';
document.getElementById('meta').textContent=`${CONFIG.client} · ${CONFIG.container}`;
function select(next){style=next;document.querySelectorAll('[data-style]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.style===style)));load()}
function load(){const dimension=toggle.checked?'3d':'2d',entry=CONFIG.views[style][dimension];loading.classList.add('show');viewer.src=entry;openLink.href=entry;current.textContent=`${CONFIG.labels[style]} · ${dimension.toUpperCase()}`;location.hash=`${style}-${dimension}`}
document.querySelectorAll('[data-style]').forEach(button=>button.addEventListener('click',()=>select(button.dataset.style)));toggle.addEventListener('change',load);viewer.addEventListener('load',()=>loading.classList.remove('show'));
const match=location.hash.slice(1).match(/^(axonometric|structured|spatial|utility)-(2d|3d)$/);if(match){style=match[1];toggle.checked=match[2]==='3d'}select(style);
</script></body></html>
