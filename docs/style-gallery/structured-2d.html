// Pure comparison logic shared by the browser and authenticated Worker.
const GTMComparison = (() => {
  const kinds = new Set(['tag','trigger','variable','builtin','folder','template','client','transformation','zone']);
  const metadata = new Set(['path','fingerprint','tagManagerUrl','accountId','containerId','workspaceId','containerVersionId']);
  const unordered = new Set(['firingTriggerId','blockingTriggerId']);
  const clone = value => JSON.parse(JSON.stringify(value));
  function normalize(value, key='', root=true) {
    if(Array.isArray(value)) {
      let items=value.map(item=>normalize(item,'',false));
      // Parameter maps are keyed; list values deliberately retain their order.
      if(['parameter','map'].includes(key) && items.every(x=>x&&typeof x==='object'&&typeof x.key==='string') && new Set(items.map(x=>x.key)).size===items.length)
        items=items.sort((a,b)=>a.key.localeCompare(b.key));
      if(unordered.has(key))items=items.sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
      return items;
    }
    if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().filter(k=>!root||!metadata.has(k)).map(k=>[k,normalize(value[k],k,false)]));
    return value;
  }
  function authoritative(node){return kinds.has(node.kind)&&!String(node.id_source||'').startsWith('derived')&&node.drift_state!=='removed';}
  function isChanged(node){return ['added','removed','modified'].includes(node.drift_state)&&kinds.has(node.kind);}
  function fieldChanges(before,after,path='$',out=[]) {
    if(JSON.stringify(before)===JSON.stringify(after))return out;
    if(before&&after&&typeof before==='object'&&typeof after==='object'&&!Array.isArray(before)&&!Array.isArray(after)) {
      for(const key of [...new Set([...Object.keys(before),...Object.keys(after)])].sort())fieldChanges(before[key],after[key],path+'.'+key,out);
    }else out.push({path,before:before===undefined?null:before,after:after===undefined?null:after,before_present:before!==undefined,after_present:after!==undefined});
    return out;
  }
  function identity(audit){const m=audit.selection||audit.meta||{};return [m.accountId||m.account_id,m.containerId||m.container_id].join('/');}
  function compare(before,after,labels={}) {
    if(identity(before)!==identity(after))throw Error('Cannot compare different GTM containers.');
    const previous=new Map((before.nodes||[]).filter(authoritative).map(n=>[n.id,n]));
    const output=clone(after),added=[],removed=[],modified=[];
    output.nodes=output.nodes.filter(n=>n.drift_state!=='removed').map(n=>{delete n.drift_state;n.flags=(n.flags||[]).filter(f=>f!=='risk-escalated');return n;});
    for(const node of output.nodes.filter(authoritative)){
      const old=previous.get(node.id);
      if(!old){node.drift_state='added';added.push({id:node.id,name:node.name,kind:node.kind,before:null,after:clone(node.details||{}),changes:[]});}
      else {
        const changes=fieldChanges(normalize(old.details||{}),normalize(node.details||{}));
        if(changes.length){node.drift_state='modified';modified.push({id:node.id,name:node.name,kind:node.kind,before:clone(old.details||{}),after:clone(node.details||{}),changed_fields:changes.map(c=>c.path),changes});}
      }
      previous.delete(node.id);
    }
    for(const old of previous.values()){
      const ghost=clone(old);ghost.drift_state='removed';output.nodes.push(ghost);
      removed.push({id:old.id,name:old.name,kind:old.kind,before:clone(old.details||{}),after:null,changes:[]});
    }
    const signature=e=>[e.from,e.to,e.kind].join('|'),keys=new Set((after.edges||[]).map(signature));
    output.edges=clone(after.edges||[]);
    for(const edge of before.edges||[])if(!keys.has(signature(edge)))output.edges.push({...clone(edge),drift_state:'removed'});
    output.drift={available:true,added,removed,modified,risk_escalated:[],basis:'full-configuration',before_label:labels.before||'Previous snapshot',after_label:labels.after||'Current snapshot',summary:`${added.length} added · ${removed.length} removed · ${modified.length} modified`};
    output.dimensions=[];output.recommendations=[];output.signals=[];
    output.meta.overall_pct=null;
    return output;
  }
  const colorFor=(node,fallback)=>({added:'#39b878',removed:'#ff625f',modified:'#ffad58'}[node.drift_state]||fallback);
  return {normalize,authoritative,isChanged,fieldChanges,compare,colorFor};
})();

  const host = drawing.parentElement;
  const panel = document.createElement('section');panel.className='versions-panel';panel.hidden=true;panel.setAttribute('aria-label','GTM version comparison');
  panel.innerHTML='<h2>Versions</h2><p>Compare actual GTM configurations. Version-count changes alone are not drift.</p><div class="versions-controls"><label>Before<select id="version-before"></select></label><label>After<select id="version-after"></select></label><button type="button" id="version-compare">Compare versions</button></div><p id="version-result" role="status" aria-live="polite"></p><p>Legend: <strong class="version-added">+ Added</strong> · <strong class="version-removed">− Removed</strong> · <strong class="version-modified">~ Modified</strong></p><button type="button" id="version-show">Show changes in diagram</button><div id="version-changes"></div>';
  host.append(panel);
  const message=document.createElement('div');message.className='version-message';message.setAttribute('role','status');message.hidden=true;host.append(message);
  const bar=document.querySelector('.mode-group,.segmented,.mode')||document.querySelector('.toolbar');
  const tab=document.createElement('button');tab.type='button';tab.className='versions-tab';tab.textContent='Versions';tab.setAttribute('aria-pressed','false');bar.append(tab);
  const beforeSelect=panel.querySelector('#version-before'),afterSelect=panel.querySelector('#version-after'),compareButton=panel.querySelector('#version-compare'),result=panel.querySelector('#version-result'),showButton=panel.querySelector('#version-show'),changesEl=panel.querySelector('#version-changes');
  const versions=config?.versions || (initial.entities_raw?.versions||[]).filter(v=>!v.synthetic).map(v=>({id:String(v.containerVersionId),name:v.name||'Unnamed version'}));
  for(const select of [beforeSelect,afterSelect]){
    for(const v of versions)select.add(new Option(`Version ${v.id} — ${v.name}`,v.id));
    select.add(new Option('Captured workspace','workspace'));
  }
  beforeSelect.value=config?.default_before||versions[0]?.id||'workspace';afterSelect.value=config?.default_after||'workspace';
  compareButton.disabled=!config || !versions.length;
  if(!config){beforeSelect.disabled=true;afterSelect.disabled=true;}

  function redraw(){
    if(typeof layout==='function')layout();
    if(typeof updateAll==='function')updateAll();
    else if(typeof render==='function')render();
    else if(typeof update==='function')update();
    if(typeof drawScene==='function')drawScene(0);
  }
  function replaceGraph(audit){
    const nextNodes=(audit.nodes||[]).map((n,i)=>({...n,_index:i,_i:i,_pos:{x:0,y:0,z:0},_p:{x:0,y:0,z:0},_screen:null,_s:null,_x:0,_y:0,_z:0,_section:''}));
    const nextEdges=(audit.edges||[]).map(e=>({...e}));
    nodes.splice(0,nodes.length,...nextNodes);edges.splice(0,edges.length,...nextEdges);
    Object.assign(AUDIT,audit);
    const lookup=typeof nodeById!=='undefined'?nodeById:byId;
    const connections=typeof adjacency!=='undefined'?adjacency:adj;
    lookup.clear();connections.clear();nodes.forEach(n=>{lookup.set(n.id,n);connections.set(n.id,new Set());});
    edges.forEach(e=>{connections.get(e.from)?.add(e.to);connections.get(e.to)?.add(e.from);});
    if(typeof kindOrder!=='undefined')kindOrder.splice(0,kindOrder.length,...Object.keys(KIND_META).filter(k=>nodes.some(n=>n.kind===k)));
    state.selected=null;
  }
  function driftMode(){
    if(typeof setMode==='function')setMode('drift');
    else {if('view' in state)state.view='drift';else state.mode='drift';document.querySelectorAll('[data-mode],[data-view]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.mode||b.dataset.view)==='drift')));}
    panel.hidden=true;tab.setAttribute('aria-pressed','false');redraw();notice();
  }
  function displayDrift(){
    const d=AUDIT.drift;if(!d)return d;
    const changedIds=new Set(nodes.filter(GTMComparison.isChanged).map(n=>n.id));
    return {...d,added:(d.added||[]).filter(r=>changedIds.has(r.id)),removed:(d.removed||[]).filter(r=>changedIds.has(r.id)),modified:(d.modified||[]).filter(r=>changedIds.has(r.id))};
  }
  function notice(){
    message.hidden=!isDrift()||!panel.hidden;
    if(busy){message.textContent='Loading full versions from GTM… No partial comparison is shown.';return;}
    const d=displayDrift();
    if(!d?.available){message.textContent='No full-version comparison is available. Open Versions to choose a baseline.';return;}
    const count=nodes.filter(GTMComparison.isChanged).length;
    message.textContent=`${d.before_label||'Previous snapshot'} → ${d.after_label||'Current snapshot'} · ${d.added?.length||0} added · ${d.removed?.length||0} removed · ${d.modified?.length||0} modified. ${count?'Only changed elements are shown. Green + additions, red − removals, amber ~ modifications.':'No configuration drift detected.'}`;
  }
  function rows(){
    changesEl.replaceChildren();const d=displayDrift();
    showButton.disabled=!d?.available;
    if(!d?.available){result.textContent=config?'Select a baseline and compare full GTM versions.':'This file has no full-version comparison. Connect GTM or supply a previous full snapshot; header counts are not sufficient.';return;}
    result.textContent=`${d.before_label||'Previous snapshot'} → ${d.after_label||'Current snapshot'} · ${d.added?.length||0} added · ${d.removed?.length||0} removed · ${d.modified?.length||0} modified`;
    if(!config)result.textContent+=' · Offline snapshot comparison; arbitrary version pairs require a live GTM connection.';
    const table=document.createElement('table');table.innerHTML='<thead><tr><th>Change</th><th>Element</th><th>Details</th></tr></thead>';const body=document.createElement('tbody');table.append(body);
    for(const [kind,symbol] of [['added','+'],['removed','−'],['modified','~']])for(const record of d[kind]||[]){
      const n=nodes.find(n=>n.id===record.id),tr=document.createElement('tr'),label=document.createElement('td'),name=document.createElement('td'),detail=document.createElement('td');
      label.className='version-'+kind;label.textContent=`${symbol} ${kind}`;
      name.textContent=`${record.name||n?.name||record.id} (${record.kind||n?.kind||''})`;
      const disclosure=document.createElement('details'),summary=document.createElement('summary');summary.textContent=kind==='modified'?`${record.changed_fields?.length||record.changes?.length||0} changed fields — inspect before / after`:'Inspect '+kind+' configuration';disclosure.append(summary);
      if(record.changes?.length){for(const change of record.changes){const title=document.createElement('strong');title.textContent=change.path;disclosure.append(title);addValues(disclosure,change.before_present?change.before:'(not present)',change.after_present?change.after:'(not present)');}}
      else addValues(disclosure,record.before??(kind==='removed'?n?.details:kind==='added'?'(not present)':'Not included in this snapshot'),record.after??(kind!=='removed'?n?.details:'(removed)'));
      detail.append(disclosure);tr.append(label,name,detail);body.append(tr);
    }
    if(body.children.length)changesEl.append(table);else changesEl.textContent='No additions, removals, or configuration modifications between these versions.';
  }
  function addValues(parent,before,after){const grid=document.createElement('div');grid.className='versions-details-grid';for(const [name,value] of [['Before',before],['After',after]]){const section=document.createElement('div'),heading=document.createElement('strong'),pre=document.createElement('pre');heading.textContent=name;pre.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);section.append(heading,pre);grid.append(section);}parent.append(grid);}
  async function compare(){
    if(!config||!versions.length){rows();notice();return;}
    if(beforeSelect.value===afterSelect.value){result.textContent='Choose two different versions.';return;}
    const id=++requestId;busy=true;compareButton.disabled=true;showButton.disabled=true;result.textContent='Loading full GTM versions…';notice();redraw();
    try{
      const query=new URLSearchParams({snapshot:config.snapshot_id,before:beforeSelect.value,after:afterSelect.value});
      const response=await fetch(config.compare_url+'?'+query,{credentials:'same-origin',cache:'no-store'}),data=await response.json();
      if(!response.ok)throw Error(data.error?.message||'Version comparison failed.');
      if(id!==requestId)return;
      replaceGraph(data.audit);comparisonLoaded=true;busy=false;rows();redraw();notice();
    }catch(error){if(id!==requestId)return;busy=false;AUDIT.drift={available:false,added:[],removed:[],modified:[]};result.textContent='Comparison unavailable: '+error.message;showButton.disabled=true;redraw();notice();message.textContent=result.textContent;}
    finally{if(id===requestId){busy=false;compareButton.disabled=false;}}
  }
  tab.addEventListener('click',()=>{panel.hidden=false;message.hidden=true;tab.setAttribute('aria-pressed','true');rows();});
  compareButton.addEventListener('click',compare);
  showButton.addEventListener('click',driftMode);
  document.querySelectorAll('[data-mode],[data-view]').forEach(button=>button.addEventListener('click',()=>{
    panel.hidden=true;tab.setAttribute('aria-pressed','false');
    if((button.dataset.mode||button.dataset.view)==='drift'){
      if(config&&!comparisonLoaded&&!busy)compare();
      else{redraw();notice();}
    }else{
      requestId++;busy=false;compareButton.disabled=!config||!versions.length;
      if(comparisonLoaded){replaceGraph(initial);comparisonLoaded=false;redraw();}
      message.hidden=true;
    }
  }));
  rows();redraw();
})();

</script>
